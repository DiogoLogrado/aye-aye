<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Static page, no scripts: the desktop window shows it from disk while the server starts. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self'" />
    <link rel="stylesheet" href="splash.css" />
    <title>Aye-aye</title>
  </head>
  <body>
    <!-- Same markup as the startup screen in index.html. -->
    <div class="splash" role="status" aria-label="Loading Aye-aye">
      <div class="splash-titlebar"></div>
      <div class="splash-body">
        <img class="splash-logo" src="favicon.svg" width="72" height="72" alt="" />
        <div class="splash-name">Aye-aye</div>
        <div class="splash-progress"></div>
      </div>
    </div>
  </body>
</html>
